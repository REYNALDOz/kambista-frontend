server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Single page app: any address that is not a file answers index.html and the router decides.
  # Without this, reloading on /historial would return a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The files in /assets have the hash of their content in the name, so they never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must always be checked again: it points to the current assets.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
